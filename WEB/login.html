<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — AgriNiramaya</title>
  <meta name="description" content="Sign in to your AgriNiramaya Agricultural Monitoring Account">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Site Header -->
  <header class="site-header">
    <div class="container nav-wrap">
      <a href="index.html" class="brand-logo">
        <div class="brand-icon">
          <svg viewBox="0 0 24 24"><path d="M17 8C8 10 5.9 16.17 3.82 21.34L5.71 22l1-2.3A4.49 4.49 0 0 0 8 20C19 20 22 3 22 3c-1 2-8 2.25-13 3.25S2 11.5 2 13.5s1.75 3.75 1.75 3.75C7 8 17 8 17 8z"/></svg>
        </div>
        <div>
          AgriNiramaya
          <span class="brand-tagline-small">Healthy Plants. Smarter Farming.</span>
        </div>
      </a>

      <nav class="main-nav">
        <a href="index.html" class="nav-link">Home</a>
        <a href="dashboard.html" class="nav-link">Dashboard</a>
        <a href="about.html" class="nav-link">About</a>
        <a href="contact.html" class="nav-link">Contact</a>
      </nav>

      <div class="nav-actions">
        <div id="nav-auth-actions" style="display:flex; align-items:center; gap:0.75rem;">
          <a href="signup.html" class="btn btn-sm btn-primary">Sign Up</a>
        </div>
        <button class="mobile-nav-toggle" aria-label="Toggle Navigation">☰</button>
      </div>
    </div>
  </header>

  <!-- Login Form Container -->
  <main class="main-content" style="display:flex; align-items:center;">
    <div class="container container-narrow">
      <div class="card" style="max-width:440px; margin:0 auto; box-shadow:var(--shadow-md);">
        <div class="card-header" style="text-align:center; display:block; padding:1.75rem 1.5rem 1rem;">
          <div style="width:48px; height:48px; margin:0 auto 0.75rem; border-radius:var(--radius-md); background:var(--primary-surface); color:var(--primary); display:flex; align-items:center; justify-content:center;">
            <svg style="width:26px; height:26px;" viewBox="0 0 24 24" fill="currentColor"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/></svg>
          </div>
          <h2 class="card-title" style="justify-content:center; font-size:1.45rem;">Sign In to AgriNiramaya</h2>
          <p style="font-size:0.88rem; color:var(--text-muted); margin-top:0.25rem;">Access your farm dashboard, sensors & leaf records</p>
        </div>

        <div class="card-body">
          <div id="login-alert" style="display:none;" class="alert alert-danger"></div>

          <form id="login-form">
            <div class="form-group">
              <label for="login-email" class="form-label">Email Address</label>
              <input type="email" id="login-email" class="form-control" placeholder="farmer@example.com" required autocomplete="email">
            </div>

            <div class="form-group">
              <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:0.4rem;">
                <label for="login-password" class="form-label" style="margin-bottom:0;">Password</label>
                <a href="forgot-password.html" style="font-size:0.82rem; font-weight:500;">Forgot Password?</a>
              </div>
              <input type="password" id="login-password" class="form-control" placeholder="••••••••" required autocomplete="current-password">
            </div>

            <button type="submit" id="login-submit-btn" class="btn btn-primary btn-block" style="margin-top:1.5rem;">
              Sign In
            </button>
          </form>
        </div>

        <div class="card-footer" style="text-align:center; font-size:0.88rem; color:var(--text-muted);">
          Don't have an account yet? <a href="signup.html" style="font-weight:600;">Sign up here</a>
        </div>
      </div>
    </div>
  </main>

  <!-- Site Footer -->
  <footer class="site-footer">
    <div class="container" style="text-align:center; padding-top:1.5rem;">
      <div style="font-size:0.85rem; color:var(--text-light);">
        © 2026 AgriNiramaya • First-Year Engineering EDI Project • Python Flask & SQLite
      </div>
    </div>
  </footer>

  <script src="js/script.js"></script>
  <script>
    document.getElementById("login-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const email = document.getElementById("login-email").value.trim();
      const password = document.getElementById("login-password").value;
      const alertBox = document.getElementById("login-alert");
      const submitBtn = document.getElementById("login-submit-btn");

      alertBox.style.display = "none";
      submitBtn.disabled = true;
      submitBtn.textContent = "Signing In...";

      const { ok, data } = await apiFetch("/api/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email, password })
      });

      submitBtn.disabled = false;
      submitBtn.textContent = "Sign In";

      if (ok && data.success) {
        if (data.token) sessionStorage.setItem("agri_token", data.token);
        if (data.user) sessionStorage.setItem("agri_user", JSON.stringify(data.user));
        showToast(`Welcome back, ${data.user.name}!`, "success");
        
        // Redirect to dashboard or return url
        const params = new URLSearchParams(window.location.search);
        const redirect = params.get("redirect") || "dashboard.html";
        setTimeout(() => {
          window.location.href = redirect;
        }, 500);
      } else {
        alertBox.textContent = data.message || "Invalid credentials. Please try again.";
        alertBox.style.display = "flex";
      }
    });
  </script>
</body>
</html>
